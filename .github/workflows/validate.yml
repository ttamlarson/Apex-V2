name: Validate OVERLOAD
on:
  pull_request:
  push:
    branches: [main]
jobs:
  coach-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run coaching engine tests
        run: node --test tests/coach-engine.test.js tests/muscle-map.test.js tests/personal-records.test.js
